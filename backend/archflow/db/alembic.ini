# Alembic CLI config for ArchFlow (the server runs migrations itself on startup, see archflow/db/migrate.py).
#   cd backend && uv run alembic -c archflow/db/alembic.ini current
#   uv run alembic -c archflow/db/alembic.ini revision --autogenerate -m "add x"
# The database comes from DATABASE_URL (Postgres) or ARCHFLOW_DB (SQLite path).
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/../..
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
