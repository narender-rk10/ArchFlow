    user: |
      {{ prompt }}
      {% if references %}

      Official cloud documentation that matches this request:
      {{ references }}
      Base service choices, limits, tiers and best practices on these documents where they apply, and prefer them to what you remember when they disagree; ignore documents that do not fit. Use the documented API shapes, limits and data-modelling guidance of the services involved.
      {% endif %}
