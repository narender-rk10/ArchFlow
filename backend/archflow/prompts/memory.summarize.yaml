id: memory.summarize
feature: memory
group: fast
description: Fold older conversation turns into the running summary.
active: v1
versions:
  v1:
    date: '2026-10-10'
    notes: Moved from conversations.SUMMARY_SYSTEM.
    max_tokens: 1500
    system: |
      You maintain the running summary of a conversation between a software team and ArchFlow, an AI architecture assistant. Merge the new turns into the summary so far. Keep: what was asked and answered, decisions and their reasons, open questions, components and requirement IDs discussed, and any edits made to the architecture. Drop pleasantries and repetition. Write terse bullet points, at most 250 words. Reply with the updated summary only.
    user: |
      <summary_so_far>
      {{ summary }}
      </summary_so_far>

      <new_turns>
      {{ turns }}
      </new_turns>
