[project]
name = "archflow"
version = "0.1.0"
description = "ArchFlow — open-source AI requirements & system architecture platform (MVP backend)"
license = { text = "CC-BY-NC-ND-4.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "anthropic>=0.60",
    "httpx>=0.27",
    "mcp>=2.2",
    "litellm>=1.70",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
# Repository analysis (code graph -> reconstructed architecture, drift, change impact). Install with:
#   uv sync --extra codegraph
codegraph = ["graphifyy==0.9.77"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
archflow-mcp = "archflow.mcp_server:main"
archflow-codegraph = "archflow.codegraph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
