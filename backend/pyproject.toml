[project]
name = "archflow"
version = "0.1.0"
description = "ArchFlow — open-source AI requirements & system architecture platform (MVP backend)"
license = { text = "CC-BY-NC-ND-4.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "mcp>=2.2",
    "litellm>=1.70",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "jsonschema>=4.20",
    "pydantic-ai-slim>=2.55,<3",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.36,<3",
    "alembic>=1.14,<2",
]

[project.optional-dependencies]
# Repository analysis (code graph -> reconstructed architecture, drift, change impact). Install with:
#   uv sync --extra codegraph
codegraph = ["graphifyy==0.9.77"]
# Export Pydantic AI agent spans over OTLP (Langfuse, Phoenix, Jaeger, Logfire, ...): set OTEL_EXPORTER_OTLP_ENDPOINT.
otel = ["opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
archflow-mcp = "archflow.mcp_server:main"
archflow-codegraph = "archflow.codegraph.cli:main"
archflow-prompts = "archflow.agents.prompts:main"
archflow-eval = "archflow.evals.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
